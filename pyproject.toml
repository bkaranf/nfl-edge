[project]
name = "nfl-edge"
version = "0.1.0"
description = "Local NFL price research and Underdog EV journal"
requires-python = "==3.12.10"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "httpx==0.28.1", "tzdata==2026.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
